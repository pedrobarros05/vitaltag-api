version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vitaltag
      POSTGRES_PASSWORD: senha
      POSTGRES_DB: vitaltag
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vitaltag"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
