name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Go quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go' ':!vendor/**'))"

      - name: Run vet
        run: go vet ./...

      - name: Run tests with race detection
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Build API
        run: go build -trimpath ./cmd/api

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore
          retention-days: 7

  schema:
    name: Database migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vitaltag
          POSTGRES_PASSWORD: senha
          POSTGRES_DB: vitaltag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vitaltag -d vitaltag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: true

      - name: Install migration tool
        run: |
          go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.17.1
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Apply migrations
        env:
          DATABASE_URL: postgres://vitaltag:senha@localhost:5432/vitaltag?sslmode=disable
        run: migrate -path migrations -database "$DATABASE_URL" up

      - name: Roll back and re-apply migrations
        env:
          DATABASE_URL: postgres://vitaltag:senha@localhost:5432/vitaltag?sslmode=disable
        run: |
          migrate -path migrations -database "$DATABASE_URL" down 1
          migrate -path migrations -database "$DATABASE_URL" up

  vulnerability:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Run govulncheck
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"

      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Scan dependencies
        run: govulncheck ./...
